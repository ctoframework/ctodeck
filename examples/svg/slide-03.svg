  <text fill="#111111" font-size="48" font-weight="bold" x="80" y="125.6">Principles</text>
  <text fill="#2b6cb0" font-size="30" font-weight="normal" x="80" y="230.9">•</text>
  <text fill="#111111" font-size="30" font-weight="normal" x="116.0" y="230.9">Keep the source of truth small and readable</text>
  <text fill="#2b6cb0" font-size="30" font-weight="normal" x="80" y="281.9">•</text>
  <text fill="#111111" font-size="30" font-weight="normal" x="116.0" y="281.9">Render to the terminal first, then to images</text>
  <text fill="#2b6cb0" font-size="30" font-weight="normal" x="80" y="332.9">•</text>
  <text fill="#111111" font-size="30" font-weight="normal" x="116.0" y="332.9">Fail loudly on bad data instead of drawing something misleading</text>
