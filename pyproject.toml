[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctodeck"
version = "0.1.0"
description = "Draw a slide deck from a YAML file, in the terminal, as PNG, or as SVG."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "svgwrite>=1.4",
]

[project.scripts]
ctodeck = "ctodeck:cli"

[tool.setuptools]
py-modules = ["ctodeck"]
